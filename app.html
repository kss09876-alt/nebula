<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05060c" />
  <title>VALIX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/app.css?v=1" />
</head>
<body class="vx">
  <header class="vx-top">
    <span class="vx-logo">VALIX</span>
    <span class="vx-top-title" id="top-title"></span>
  </header>

  <main id="view" class="vx-view" aria-live="polite"></main>

  <nav class="vx-tabs" aria-label="메뉴">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span data-t="홈">홈</span></button>
    <button data-tab="list"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-20 12 12)"/></svg><span data-t="전시">전시</span></button>
    <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg><span data-t="내 서재">내 서재</span></button>
    <button data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="MY">MY</span></button>
  </nav>

  <!-- 전시 보기: 같은 주소의 전시 페이지를 그대로 띄움 -->
  <section id="viewer" class="vx-viewer" hidden>
    <iframe id="frame" title="전시" allow="accelerometer; gyroscope; magnetometer; camera; microphone; geolocation; autoplay; fullscreen; screen-wake-lock"></iframe>
    <button id="close" class="vx-close" aria-label="전시 나가기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </section>

  <!-- 착륙 로딩: 우주인이 행성으로 들어감 -->
  <section id="landing" class="vx-landing" hidden aria-live="polite">
    <canvas id="land-cv"></canvas>
    <div class="vx-land-text">
      <p id="land-code"></p>
      <h2 id="land-title"></h2>
      <p id="land-state"></p>
      <button id="land-retry" hidden></button>
    </div>
  </section>

  <div id="boot" class="vx-boot"><span></span></div>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
