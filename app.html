<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060c" />
  <meta name="description" content="ARTMOS — 전시를 탐색하고 행성에 착륙하는 온라인 인터랙티브 전시 앱" />
  <title>ARTMOS — Exhibition Atlas</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 글꼴은 화면에 쓰인 글자만 내려받고, 받는 동안에도 화면을 막지 않음 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/app.css?v=11" />
  <link rel="stylesheet" href="css/refinement.css?v=2" />
  <link rel="stylesheet" href="css/app-nebula.css?v=2" />
  <link rel="stylesheet" href="css/app-polish.css?v=8" />
  <link rel="stylesheet" href="css/artmos-brand.css?v=1" />
  <link rel="icon" href="assets/nebula-mark.svg" type="image/svg+xml" />
</head>
<body class="vx nebula-refined">
  <!-- 첫 실행: 시작 화면 → 소개 → 로그인 → 닉네임 -->
  <script type="module" src="js/app-intro.js?v=4"></script>
  <section id="splash" class="vx-splash"><div class="mark"><span class="halo"></span><img class="nb-splash-mark" src="assets/nebula-mark.svg" alt="" /><b>ARTMOS</b><small>EXHIBITION ATLAS</small></div><p class="foot">ARTMOS · Online Interactive Exhibition</p></section>
  <section id="onboard" class="vx-onboard" hidden></section>

  <main id="view" class="vx-view" hidden></main>

  <nav id="tabs" class="vx-tabs" hidden aria-label="메뉴">
    <div class="pill"><span class="ind"></span>
      <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-20 12 12)"/></svg><span data-t="전시">전시</span></button>
      <button data-tab="play"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="3.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13 20 20h-7z"/></svg><span data-t="플레이">플레이</span></button>
      <button data-tab="shop"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="1.5"/><rect x="7.5" y="7" width="9" height="8" rx=".5"/><path d="M8 18h8"/></svg><span data-t="컬렉트">컬렉트</span></button>
      <button data-tab="reward"><svg viewBox="0 0 24 24"><path d="M12 3.5 14.4 9l5.6.5-4.3 3.7 1.3 5.6L12 15.9 7 18.8l1.3-5.6L4 9.5 9.6 9z"/></svg><span data-t="리워드">리워드</span></button>
      <button data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="마이">마이</span></button>
    </div>
    <button class="orb" data-orb aria-label="오늘의 행성으로 바로 입장"><svg viewBox="0 0 24 24"><path d="M5 19c3-1 5-3 6.5-6.5M14 4l1.2 2.8L18 8l-2.8 1.2L14 12l-1.2-2.8L10 8l2.8-1.2z"/><circle cx="7" cy="17" r="2"/></svg></button>
  </nav>

  <section id="viewer" class="vx-viewer" hidden>
    <iframe id="frame" title="전시" allow="accelerometer; gyroscope; magnetometer; camera; microphone; geolocation; autoplay; fullscreen; screen-wake-lock"></iframe>
    <button id="close" class="vx-close" aria-label="전시 나가기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </section>

  <section id="landing" class="vx-landing" hidden aria-live="polite">
    <canvas id="land-cv"></canvas>
    <div class="vx-land-text"><p id="land-code"></p><h2 id="land-title"></h2><p id="land-state"></p><button id="land-retry" hidden></button></div>
    <button id="land-cancel" class="vx-close" aria-label="착륙 취소"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </section>

  <div id="toast" class="vx-toast" hidden></div>
  <script type="module" src="js/app.js?v=32"></script>
</body>
</html>
